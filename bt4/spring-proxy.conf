server {
    listen 80;
    
    # Bắt tất cả các tên miền hoặc IP trỏ về máy chủ này
    server_name _;

    # 1. Phục vụ nội dung tĩnh tại trang chủ (/)
    location / {
        root /var/www/html;
        index index.html;
    }

    # 2. Reverse Proxy chuyển tiếp các request có tiền tố /api/ đến Spring Boot (cổng 8082)
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
